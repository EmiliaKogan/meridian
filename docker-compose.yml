services:
  postgres: #DB
    image: postgres:16 # Official PostgreSQL image

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment: # Database configuration
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian

    volumes: # Persist PostgreSQL data outside the container
      - postgres_data:/var/lib/postgresql/data

    ports: # Expose PostgreSQL to the host machine
      - "5432:5432"

  app: 
    build: .  # Build the application image from the Dockerfile

    depends_on: # Start the application after PostgreSQL is started
      postgres:
        condition: service_healthy

    environment: # Provide the database connection string to the application (DSN)
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian

    volumes:
      - bronze_data:/data/bronze

volumes: # Named volume used to persist database data
  postgres_data:
  bronze_data:


