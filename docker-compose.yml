services:
  postgres:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: meridian
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
    volumes:
      - bronze_data:/data/bronze
  
  bronze-init:
    image: alpine:3.20
    user: "0:0"
    command: sh -c "chmod 0777 /data/bronze"
    volumes:
      - bronze_data:/data/bronze

  airflow-db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  airflow:
    group_add:
    - "1001"
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bronze-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c",  "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health')",]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      DATABASE_URL: postgresql://meridian:meridian@postgres:5432/meridian
      PYTHONPATH: /opt/airflow/project/src
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - bronze_data:/data/bronze
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/airflow/project:ro
    ports:
      - "8080:8080"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        printf '{"airflow":"airflow"}' > /opt/airflow/simple_auth_manager_passwords.json
        exec airflow standalone

volumes:
  postgres_data:
  bronze_data:
  airflow_db_data:
  airflow_logs:
  airflow_creds: