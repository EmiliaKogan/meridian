[project]
name = "meridian"
version = "0.1.0"
description = "Meridian bike-share data platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "httpx>=0.28.1",
    "psycopg>=3.3.4",
]

[dependency-groups]
dev = [
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "testcontainers>=4.15.0",
]
